skill: casdev-questions
version: v1
static:
  required_sections: [Назначение, "Когда включать", "Адаптация под паспорт", Допрос, Конвейер, "Коробка ИИ", "Критерии приёмки", "Отказы и границы", "Доказательство «Сработало»"]
  min_criteria: 4
scenarios:
  - id: s1-rules
    input: "Запусти навык «Вопросы для касдев-интервью» для моей задачи и пройди его по правилам методики."
    must:
      - "Ровно 8 вопросов."
      - "Все вопросы открытые и не наводящие; нет «было бы тебе полезно, если бы...»."
      - "Вопросы про текущий опыт («как решал в последний раз»)."
    must_not:
      - "выдаёт выдуманные факты, цифры или источники"
      - "обещает человеку заработок"
pass_score: 8
real_run_proof:
  - "Человек провёл хотя бы 3 интервью по списку и принёс ответы или записи; агент разбирает их и обновляет карточку."
