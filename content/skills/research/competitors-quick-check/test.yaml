skill: competitors-quick-check
version: v1
static:
  required_sections: [Назначение, "Когда включать", "Адаптация под паспорт", Допрос, Конвейер, "Коробка ИИ", "Критерии приёмки", "Отказы и границы", "Доказательство «Сработало»"]
  min_criteria: 4
scenarios:
  - id: s1-rules
    input: "Запусти навык «Быстрая проверка конкурентов» для моей задачи и пройди его по правилам методики."
    must:
      - "Агент составил 10–15 формулировок задачи на русском и английском до поиска."
      - "Найдено не меньше 15 кандидатов до фильтрации или перечислены проверенные источники."
      - "У каждой цифры выручки есть ссылка и тип (подтверждено / со слов / оценка); выручка не прикидывается самим агентом."
    must_not:
      - "выдаёт выдуманные факты, цифры или источники"
      - "обещает человеку заработок"
pass_score: 8
real_run_proof:
  - "Человек подтверждает вердикт и выбирает: идти дальше (`competitors-analysis`, `idea-validation`) или менять идею. Ссылки в отчёте открываются."
