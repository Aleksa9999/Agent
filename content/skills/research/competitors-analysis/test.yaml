skill: competitors-analysis
version: v1
static:
  required_sections: [Назначение, "Когда включать", "Адаптация под паспорт", Допрос, Конвейер, "Коробка ИИ", "Критерии приёмки", "Отказы и границы", "Доказательство «Сработало»"]
  min_criteria: 4
scenarios:
  - id: s1-rules
    input: "Запусти навык «Поиск и анализ конкурентов» для моей задачи и пройди его по правилам методики."
    must:
      - "Таблицы конкурентов, матрица функций (есть / нет / частично) и тарифы присутствуют в файле."
      - "У каждого факта есть ссылка; чего нет, помечено «не найдено»."
      - "По каждому прямому конкуренту есть 1–2 дословные цитаты пользователей: жалобы, просьбы, причины ухода."
    must_not:
      - "выдаёт выдуманные факты, цифры или источники"
      - "обещает человеку заработок"
pass_score: 8
real_run_proof:
  - "Файл `_docs/competitors.md` с источниками и датой в репозитории проекта человека; ссылки открываются."
