skill: complaints-analysis
version: v1
static:
  required_sections: [Назначение, "Когда включать", "Адаптация под паспорт", Допрос, Конвейер, "Коробка ИИ", "Критерии приёмки", "Отказы и границы", "Доказательство «Сработало»"]
  min_criteria: 4
scenarios:
  - id: s1-rules
    input: "Запусти навык «Разбор жалоб на конкурентов» для моей задачи и пройди его по правилам методики."
    must:
      - "Агент сначала показал список площадок со статусом «прочитал сам» или «нужен скриншот» и дождался подтверждения."
      - "Каждая жалоба содержит формулировку, число упоминаний по площадкам отдельно, 1–2 дословные цитаты, дату и сегмент, если видно."
      - "Запросы с досок идей: название, голоса, статус, давность; статус «в работе» или «запланировано» помечен как не-щель."
    must_not:
      - "выдаёт выдуманные факты, цифры или источники"
      - "обещает человеку заработок"
pass_score: 8
real_run_proof:
  - "Отчёт в чате с цитатами и ссылками; человек подтверждает, что хотя бы одна гипотеза идёт в `idea-validation`."
