skill: idea-validation
version: v1
static:
  required_sections: [Назначение, "Когда включать", "Адаптация под паспорт", Допрос, Конвейер, "Коробка ИИ", "Критерии приёмки", "Отказы и границы", "Доказательство «Сработало»"]
  min_criteria: 4
scenarios:
  - id: s1-rules
    input: "Запусти навык «Валидация идеи» для моей задачи и пройди его по правилам методики."
    must:
      - "Агент задал 10 вопросов пачками по 5, пропустил то, что уже есть в карточке."
      - "Проблема сформулирована как «[кто] не может [что], из-за чего [последствие]» или сказано, что не получилось."
      - "Проверка по красным и зелёным флагам из методики с ссылкой на ответы человека."
    must_not:
      - "выдаёт выдуманные факты, цифры или источники"
      - "обещает человеку заработок"
pass_score: 8
real_run_proof:
  - "Вердикт, принятый человеком, и следующее действие: касдев, ручной пилот с оплатой или смена идеи."
