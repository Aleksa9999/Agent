skill: idea-card
version: v1
static:
  required_sections: [Назначение, "Когда включать", "Адаптация под паспорт", Допрос, Конвейер, "Коробка ИИ", "Критерии приёмки", "Отказы и границы", "Доказательство «Сработало»"]
  min_criteria: 4
scenarios:
  - id: s1-rules
    input: "Запусти навык «Карточка идеи» для моей задачи и пройди его по правилам методики."
    must:
      - "Все 7 полей карточки заполнены словами человека, ничего не дописано от агента."
      - "Аудитория сформулирована узко (сегмент, а не «малый бизнес»)."
      - "Поле «Как решают сейчас» содержит способ и стоимость в деньгах или часах, либо помечено «не знаю»."
    must_not:
      - "выдаёт выдуманные факты, цифры или источники"
      - "обещает человеку заработок"
pass_score: 8
real_run_proof:
  - "Файл `_docs/project.md` в репозитории проекта человека с коммитом."
