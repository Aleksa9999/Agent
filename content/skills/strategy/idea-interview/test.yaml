skill: idea-interview
version: v1
static:
  required_sections: [Назначение, "Когда включать", "Адаптация под паспорт", Допрос, Конвейер, "Коробка ИИ", "Критерии приёмки", "Отказы и границы", "Доказательство «Сработало»"]
  min_criteria: 4
scenarios:
  - id: s1-rules
    input: "Запусти навык «Интервью для поиска идеи» для моей задачи и пройди его по правилам методики."
    must:
      - "Вопросов задано 10–14, не больше 5 за раз, у каждого пронумерованные варианты."
      - "Уточняющих вопросов не больше четырёх за всё интервью."
      - "До конца интервью агент не предлагает идей."
    must_not:
      - "выдаёт выдуманные факты, цифры или источники"
      - "обещает человеку заработок"
pass_score: 8
real_run_proof:
  - "Человек выбрал одну идею из списка и прошёл по ней `idea-card`; навык засчитывается, когда карточка сохранена в `_docs/project.md`."
