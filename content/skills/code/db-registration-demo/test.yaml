skill: db-registration-demo
version: v1
static:
  required_sections: [Назначение, "Когда включать", "Адаптация под паспорт", Допрос, Конвейер, "Коробка ИИ", "Критерии приёмки", "Отказы и границы", "Доказательство «Сработало»"]
  min_criteria: 4
scenarios:
  - id: s1-rules
    input: "Запусти навык «База данных и форма регистрации (демо пути данных)» для моей задачи и пройди его по правилам методики."
    must:
      - "База поднята локально, не в контейнере; подключение описано в `.env`."
      - "Модель пользователя описана в Prisma."
      - "Страница `/register` отправляет email и пароль и создаёт строку в таблице."
    must_not:
      - "выдаёт выдуманные факты, цифры или источники"
      - "обещает человеку заработок"
pass_score: 8
real_run_proof:
  - "Скриншот таблицы с двумя строками в pgAdmin и ветка демо в репозитории."
