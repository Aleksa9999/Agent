skill: git-basics
version: v1
static:
  required_sections: [Назначение, "Когда включать", "Адаптация под паспорт", Допрос, Конвейер, "Коробка ИИ", "Критерии приёмки", "Отказы и границы", "Доказательство «Сработало»"]
  min_criteria: 4
scenarios:
  - id: s1-rules
    input: "Запусти навык «Git и GitHub: установка, репозиторий, коммит, откат» для моей задачи и пройди его по правилам методики."
    must:
      - "Git установлен и настроен: имя и email, push работает без запроса пароля."
      - "Проект инициализирован и отправлен на GitHub в ветку `main`."
      - "Коммит сделан с коротким описанием изменений."
    must_not:
      - "выдаёт выдуманные факты, цифры или источники"
      - "обещает человеку заработок"
pass_score: 8
real_run_proof:
  - "Ссылка на репозиторий с историей коммитов и скриншот вкладки коммитов на GitHub."
