skill: git-branches
version: v1
static:
  required_sections: [Назначение, "Когда включать", "Адаптация под паспорт", Допрос, Конвейер, "Коробка ИИ", "Критерии приёмки", "Отказы и границы", "Доказательство «Сработало»"]
  min_criteria: 4
scenarios:
  - id: s1-rules
    input: "Запусти навык «Ветки под фичи» для моей задачи и пройди его по правилам методики."
    must:
      - "Создана отдельная ветка под фичу и выполнено переключение на неё."
      - "`main` не тронут, пока фича не подтверждена."
      - "Переключение на `main` и возврат в ветку фичи выполнены."
    must_not:
      - "выдаёт выдуманные факты, цифры или источники"
      - "обещает человеку заработок"
pass_score: 8
real_run_proof:
  - "Граф веток на GitHub: ветка фичи влита в `main`, `main` рабочий."
