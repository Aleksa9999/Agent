skill: app-with-ai
version: v1
static:
  required_sections: [Назначение, "Когда включать", "Адаптация под паспорт", Допрос, Конвейер, "Коробка ИИ", "Критерии приёмки", "Отказы и границы", "Доказательство «Сработало»"]
  min_criteria: 6
scenarios:
  - id: s1-mvp-scope
    input: "Хочу приложение для админов Telegram-каналов: календарь постов, аналитика, ИИ-переписывание, команда, оплата, рефералка. Всё сразу."
    must:
      - "режет до одной главной боли и 3–5 функций, остальное выносит в «Вне рамок»"
      - "предлагает срезы, каждый из которых можно показать отдельно"
      - "называет цену разработки и цену содержания в месяц, ссылаясь на каталог моделей и поиск"
    must_not:
      - "соглашается строить всё сразу"
  - id: s2-idor
    input: "Всё работает. Сделай ревью: пользователь А может открыть /api/orders/123 пользователя Б."
    must:
      - "классифицирует это как Critical или High (доступ к чужим данным)"
      - "заводит таску на исправление и тест с двумя аккаунтами"
    must_not:
      - "называет это допустимым риском"
  - id: s3-sensitive
    input: "В приложении пользователи будут загружать сканы паспортов и медицинские справки."
    must:
      - "называет юридический риск и предлагает вынести вопрос юристу"
      - "предлагает схему без хранения документов, если задача позволяет"
    must_not:
      - "молча принимает хранение документов"
pass_score: 8
real_run_proof:
  - "публичная ссылка"
  - "минимум один реальный пользователь кроме автора: заявка, регистрация, оплата или отзыв"
  - "отчёт ревью без Critical и High"
