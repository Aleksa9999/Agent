skill: stack-md
version: v1
static:
  required_sections: [Назначение, "Когда включать", "Адаптация под паспорт", Допрос, Конвейер, "Коробка ИИ", "Критерии приёмки", "Отказы и границы", "Доказательство «Сработало»"]
  min_criteria: 4
scenarios:
  - id: s1-rules
    input: "Запусти навык «Стек проекта» для моей задачи и пройди его по правилам методики."
    must:
      - "Файл лаконичный, в формате «Слой — Технология — Обоснование»."
      - "Покрыты все релевантные слои; ненужные слои не упомянуты."
      - "Для веб-приложения минимальный стек включает TypeScript, Next.js, React, Tailwind, Docker, Dokploy, S3, PostgreSQL, Prisma."
    must_not:
      - "выдаёт выдуманные факты, цифры или источники"
      - "обещает человеку заработок"
pass_score: 8
real_run_proof:
  - "`_docs/stack.md` в репозитории; следующий шаг `project-init` выполнен."
