skill: pgadmin-connect
version: v1
static:
  required_sections: [Назначение, "Когда включать", "Адаптация под паспорт", Допрос, Конвейер, "Коробка ИИ", "Критерии приёмки", "Отказы и границы", "Доказательство «Сработало»"]
  min_criteria: 4
scenarios:
  - id: s1-rules
    input: "Запусти навык «Подключение pgAdmin к локальной базе» для моей задачи и пройди его по правилам методики."
    must:
      - "Инструкция использует реальные значения пользователя, пароля, хоста, порта и имени базы из `.env`."
      - "Шаги: Add New Server, General, Connection, сохранение."
      - "В pgAdmin видны схемы, таблицы и строки пользователя."
    must_not:
      - "выдаёт выдуманные факты, цифры или источники"
      - "обещает человеку заработок"
pass_score: 8
real_run_proof:
  - "Скриншот pgAdmin с таблицей пользователя."
