skill: project-init
version: v1
static:
  required_sections: [Назначение, "Когда включать", "Адаптация под паспорт", Допрос, Конвейер, "Коробка ИИ", "Критерии приёмки", "Отказы и границы", "Доказательство «Сработало»"]
  min_criteria: 4
scenarios:
  - id: s1-rules
    input: "Запусти навык «Инициализация проекта» для моей задачи и пройди его по правилам методики."
    must:
      - "Проект создан по последним стандартам стека без второстепенных зависимостей."
      - "Проект запускается локально и открывается на `localhost`."
      - "Структура каталогов создана."
    must_not:
      - "выдаёт выдуманные факты, цифры или источники"
      - "обещает человеку заработок"
pass_score: 8
real_run_proof:
  - "Скриншот или лог запущенного проекта на localhost; папка проекта с `package.json` (или аналогом)."
