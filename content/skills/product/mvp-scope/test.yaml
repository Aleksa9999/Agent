skill: mvp-scope
version: v1
static:
  required_sections: [Назначение, "Когда включать", "Адаптация под паспорт", Допрос, Конвейер, "Коробка ИИ", "Критерии приёмки", "Отказы и границы", "Доказательство «Сработало»"]
  min_criteria: 4
scenarios:
  - id: s1-rules
    input: "Запусти навык «Состав MVP» для моей задачи и пройди его по правилам методики."
    must:
      - "Предложение о том, что именно делает MVP, одно."
      - "Функций 3–5, у каждой: что делает, кто использует, сложность (низкая / средняя / высокая)."
      - "Есть раздел «Что не входит и почему»."
    must_not:
      - "выдаёт выдуманные факты, цифры или источники"
      - "обещает человеку заработок"
pass_score: 8
real_run_proof:
  - "`_docs/mvp.md` в репозитории и подтверждение человека; навык `app-with-ai` или `site-with-ai` стартует от этого файла."
