skill: features-roadmap
version: v1
static:
  required_sections: [Назначение, "Когда включать", "Адаптация под паспорт", Допрос, Конвейер, "Коробка ИИ", "Критерии приёмки", "Отказы и границы", "Доказательство «Сработало»"]
  min_criteria: 4
scenarios:
  - id: s1-rules
    input: "Запусти навык «Функционал итогового продукта» для моей задачи и пройди его по правилам методики."
    must:
      - "Файл содержит функции сверх MVP в двух очередях: сразу и позже."
      - "По каждой функции указано, какую боль она закрывает и кто пользуется."
      - "Учтено, что есть у конкурентов, если есть `competitors.md`."
    must_not:
      - "выдаёт выдуманные факты, цифры или источники"
      - "обещает человеку заработок"
pass_score: 8
real_run_proof:
  - "`_docs/features.md` в репозитории; подтверждение человека."
