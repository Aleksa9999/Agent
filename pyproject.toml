[project]
name = "googlagent"
version = "0.1.0"
description = "Googlagent: personal AI agent in Telegram (SuperAi Studio)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["content/methods"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"app/db/migrations/*" = ["I001"]
"tools/migrate_lessons.py" = ["E501", "E741"]  # one-off converter, long Russian lines

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
