# Host Nginx site for the Mini App and the Telegram webhook (certbot manages the TLS lines).
# Copy to /etc/nginx/sites-available/googlagent and replace APP_DOMAIN with the real domain.
server {
    listen 80;
    server_name APP_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name APP_DOMAIN;
    # ssl_certificate and ssl_certificate_key are added by certbot

    client_max_body_size 25m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:8000;   # test stack; prod uses 8100
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
        proxy_read_timeout 60s;
    }
}
